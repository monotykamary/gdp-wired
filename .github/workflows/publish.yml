name: Publish

# Releases of gdp-wired and gdp-wired-cli (packages/cli: gdp-wired's CLI with
# TypeScript beside it) go out from here, and only from here, together.
#
#   1. Set the version of both: `bun scripts/version.ts X.Y.Z` (the
#      `chore(release): X.Y.Z` commit; core/exports.test.ts checks they agree).
#   2. Push it to main. This workflow publishes every version that npm does
#      not have yet; any other push is a no-op.
#
# Run it from the Actions tab to retry a failed release, or tick "dry_run" to
# build, check and pack without publishing.
#
# Auth is npm Trusted Publishing (OIDC): npm trusts this file, so no npm token
# is stored anywhere. Only the publish job gets an OIDC token (id-token: write),
# and it runs on GitHub's own runner: npm's trusted publishing and provenance
# support GitHub's cloud-hosted runners only, not instabox's. The checks
# (test.yml's jobs) and the full gate (every suite job, scripts/release-ci/FULL-GATE.md) run on instabox boxes.
# Registered once with
#   npm trust github gdp-wired --repo monotykamary/gdp-wired --file publish.yml --allow-publish
# gdp-wired-cli's first version is published by hand (a new name has nothing to
# trust yet: npm publish with an OTP), then registered once the same way:
#   npm trust github gdp-wired-cli --repo monotykamary/gdp-wired --file publish.yml --allow-publish
# (Publish that first version, at the release's version, before pushing the
# release commit; else this workflow publishes gdp-wired and fails on it.)
#
# Bun installs and packs exactly as `bun publish` does; npm uploads the
# tarballs because only the npm CLI speaks trusted publishing. Before upload,
# each tarball is installed into an empty project and run under Node and
# type-checked as a TypeScript consumer (scripts/smoke.sh).

on:
  push:
    branches: [main]
    paths: [package.json, packages/cli/package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and pack, but do not publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    # (this repository only: in a fork, test.yml's instabox checks are skipped, so nothing past here may run there)
    if: github.repository == 'monotykamary/gdp-wired'
    # (ubuntu-24.04, not ubuntu-latest: -latest moves to Ubuntu 26.04 in November 2026, which changes the clang and the
    # JDK the C, C++, Java and Kotlin cases run on; 24.04's are clang 18.1.3 and JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.release.outputs.mode }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Find versions npm does not have
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          specs=$(
          node -p "const p = require('./package.json'); p.name + '@' + p.version"
          node -p "const p = require('./packages/cli/package.json'); p.name + '@' + p.version"
          )
          missing=""
          for spec in $specs; do
            # npm runs from outside the checkout so the repo's settings do not apply.
            if (cd "$RUNNER_TEMP" && npm view "$spec" version >/dev/null 2>&1); then
              echo "$spec is already on npm"
            else
              missing="$missing $spec"
            fi
          done
          if [ "$DRY_RUN" = "true" ]; then
            mode=dry-run
          elif [ -n "$missing" ]; then
            mode=publish
            echo "::notice::Publishing$missing"
          else
            mode=skip
            echo "::notice::Nothing to publish"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # The checks of test.yml (types and lint, the quick tests in parallel shards, the package on Node 20 and 24), as
  # jobs of this run: nothing is packed or published unless every one passes. (Its instabox jobs carry their own guard:
  # this repository only; a push to main or a dispatch here passes it.)
  check:
    needs: release
    if: needs.release.outputs.mode != 'skip'
    uses: ./.github/workflows/test.yml

  # The full gate (scripts/release-ci/FULL-GATE.md): every job of supercomputer/suite.json, once, at this commit, on a
  # fresh instabox box of its image's snapshot; then a verdict over all of them. Nothing is published unless every
  # job passed, or failed exactly as scripts/release-ci/known-failures.json records, in this run's first attempt.
  suite-matrix:
    needs: release
    if: needs.release.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: One entry per suite job
        id: matrix
        run: echo "matrix=$(bun scripts/release-ci/full-suite.ts matrix)" >> "$GITHUB_OUTPUT"

  full-suite:
    name: Suite ${{ matrix.name }}
    needs: [release, suite-matrix]
    if: needs.release.outputs.mode != 'skip'
    runs-on: ${{ matrix.runsOn }}
    # (the longest suite job's timeout is an hour; the checkout and install around it)
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 64
      matrix: ${{ fromJSON(needs.suite-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: The box
        run: |
          echo "user $(id -un), HOME $HOME"; grep -m1 'model name' /proc/cpuinfo; nproc; free -g | head -2
          for t in bun node lean lake java swift clang; do printf '%s: %s\n' "$t" "$(PATH="$HOME/.bun/bin:$HOME/.elan/bin:/opt/node/bin:/opt/swift/usr/bin:$PATH" command -v $t || echo missing)"; done
      - name: Install dependencies
        run: PATH="$HOME/.bun/bin:$PATH" bun install --frozen-lockfile
      - name: ${{ matrix.name }}
        env:
          NAME: ${{ matrix.name }}
        run: PATH="$HOME/.bun/bin:$PATH" bun scripts/release-ci/full-suite.ts run "$NAME" "$RUNNER_TEMP/out/$NAME"
      - name: Its result, logs and files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-${{ matrix.name }}
          path: ${{ runner.temp }}/out/${{ matrix.name }}
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore

  full-gate:
    needs: [release, full-suite]
    if: always() && needs.release.outputs.mode != 'skip'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: full-suite-*
          path: ${{ runner.temp }}/results
      - name: The verdict over every suite job
        run: bun scripts/release-ci/full-suite.ts gate "$RUNNER_TEMP/results"

  publish:
    needs: [release, check, full-gate]
    if: needs.release.outputs.mode != 'skip'
    # (ubuntu-24.04, not ubuntu-latest: -latest moves to Ubuntu 26.04 in November 2026, which changes the clang and the
    # JDK the C, C++, Java and Kotlin cases run on; 24.04's are clang 18.1.3 and JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # (the OIDC token npm exchanges for a publish token and signs the provenance with: this job only)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack
        run: |
          bun run --if-present prepublishOnly
          bun pm pack --destination "$RUNNER_TEMP/pack"
          (cd packages/cli && bun pm pack --destination "$RUNNER_TEMP/pack-cli")

      - name: Smoke-test the tarballs
        run: |
          sh scripts/smoke.sh "$RUNNER_TEMP"/pack/gdp-wired-*.tgz "$RUNNER_TEMP"/pack-cli/gdp-wired-cli-*.tgz

      - name: Publish
        env:
          MODE: ${{ needs.release.outputs.mode }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install --global npm@latest
          cd "$RUNNER_TEMP"
          # ./ keeps npm from reading pack/name.tgz as a GitHub repo shorthand;
          # gdp-wired first, as gdp-wired-cli depends on it.
          for tarball in ./pack/*.tgz ./pack-cli/*.tgz; do
            spec=$(tar -xOzf "$tarball" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")
            echo "::group::$spec"
            tar -tzf "$tarball"
            echo "::endgroup::"
            if [ "$MODE" = "dry-run" ]; then
              echo "Dry run: not publishing $spec"
            elif npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
