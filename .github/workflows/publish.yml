name: Publish

# Releases of gdp-wired and gdp-wired-cli (packages/cli: gdp-wired's CLI with
# TypeScript beside it) go out from here, and only from here, together.
#
#   1. Set the version of both: `bun scripts/version.ts X.Y.Z` (the
#      `chore(release): X.Y.Z` commit; core/exports.test.ts checks they agree).
#   2. Push it to main. This workflow publishes every version that npm does
#      not have yet; any other push is a no-op.
#
# Run it from the Actions tab to retry a failed release, or tick "dry_run" to
# build, check and pack without publishing.
#
# Auth is npm Trusted Publishing (OIDC): npm trusts this file, so no npm token
# is stored anywhere. Registered once with
#   npm trust github gdp-wired --repo monotykamary/gdp-wired --file publish.yml --allow-publish
# gdp-wired-cli's first version is published by hand (a new name has nothing to
# trust yet: npm publish with an OTP), then registered once the same way:
#   npm trust github gdp-wired-cli --repo monotykamary/gdp-wired --file publish.yml --allow-publish
# (Publish that first version, at the release's version, before pushing the
# release commit; else this workflow publishes gdp-wired and fails on it.)
#
# Bun installs and packs exactly as `bun publish` does; npm uploads the
# tarballs because only the npm CLI speaks trusted publishing. Before upload,
# each tarball is installed into an empty project and run under Node and
# type-checked as a TypeScript consumer (scripts/smoke.sh).

on:
  push:
    branches: [main]
    paths: [package.json, packages/cli/package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and pack, but do not publish
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # (ubuntu-24.04, not ubuntu-latest: -latest moves to Ubuntu 26.04 in November 2026, which changes the clang and the
    # JDK the C, C++, Java and Kotlin cases run on; 24.04's are clang 18.1.3 and JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Find versions npm does not have
        id: release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          specs=$(
          node -p "const p = require('./package.json'); p.name + '@' + p.version"
          node -p "const p = require('./packages/cli/package.json'); p.name + '@' + p.version"
          )
          missing=""
          for spec in $specs; do
            # npm runs from outside the checkout so the repo's settings do not apply.
            if (cd "$RUNNER_TEMP" && npm view "$spec" version >/dev/null 2>&1); then
              echo "$spec is already on npm"
            else
              missing="$missing $spec"
            fi
          done
          if [ "$DRY_RUN" = "true" ]; then
            mode=dry-run
          elif [ -n "$missing" ]; then
            mode=publish
            echo "::notice::Publishing$missing"
          else
            mode=skip
            echo "::notice::Nothing to publish"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release.outputs.mode != 'skip'
        run: bun install --frozen-lockfile

      - name: Check
        if: steps.release.outputs.mode != 'skip'
        run: |
          bun run check
          bun run test

      - name: Pack
        if: steps.release.outputs.mode != 'skip'
        run: |
          bun run --if-present prepublishOnly
          bun pm pack --destination "$RUNNER_TEMP/pack"
          (cd packages/cli && bun pm pack --destination "$RUNNER_TEMP/pack-cli")

      - name: Smoke-test the tarballs
        if: steps.release.outputs.mode != 'skip'
        run: |
          sh scripts/smoke.sh "$RUNNER_TEMP"/pack/gdp-wired-*.tgz "$RUNNER_TEMP"/pack-cli/gdp-wired-cli-*.tgz

      - name: Publish
        if: steps.release.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.release.outputs.mode }}
        run: |
          # Trusted publishing needs npm 11.5.1 or newer.
          npm install --global npm@latest
          cd "$RUNNER_TEMP"
          # ./ keeps npm from reading pack/name.tgz as a GitHub repo shorthand;
          # gdp-wired first, as gdp-wired-cli depends on it.
          for tarball in ./pack/*.tgz ./pack-cli/*.tgz; do
            spec=$(tar -xOzf "$tarball" package/package.json | node -p "const p = JSON.parse(require('fs').readFileSync(0, 'utf8')); p.name + '@' + p.version")
            echo "::group::$spec"
            tar -tzf "$tarball"
            echo "::endgroup::"
            if [ "$MODE" = "dry-run" ]; then
              echo "Dry run: not publishing $spec"
            elif npm view "$spec" version >/dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
