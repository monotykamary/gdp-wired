name: Kernel primitive native differential probes
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kernel/integer-primitives*.ts'
      - 'kernel/word-division*.ts'
      - 'core/fixed-*.ts'
      - 'core/dsl.ts'
      - 'core/machine.ts'
      - 'research/kernel-primitives/**'
      - 'kernel/mutants.ts'
      - 'lean-kernel/**'
      - 'scripts/gen-lean-library.ts'
      - '.github/workflows/kernel-primitives.yml'
  push:
    paths:
      - 'kernel/integer-primitives*.ts'
      - 'kernel/word-division*.ts'
      - 'core/fixed-*.ts'
      - 'core/dsl.ts'
      - 'core/machine.ts'
      - 'research/kernel-primitives/**'
      - 'kernel/mutants.ts'
      - 'lean-kernel/**'
      - 'scripts/gen-lean-library.ts'
      - '.github/workflows/kernel-primitives.yml'
jobs:
  native-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Verify required toolchains (missing is fatal)
        run: |
          cc --version
          rustc --version
          go version
          python3 --version
      - name: Check limb DSL and exact integer fuzz regressions
        run: bun test core/fixed-integers.test.ts core/fixed-constant-division.test.ts core/fixed-division.test.ts core/fixed-integration.test.ts core/fixed-division-integration.test.ts core/fixed-division-proof.test.ts core/fixed-admission.test.ts lean-kernel/word-division-export.test.ts kernel/integer-primitives.test.ts kernel/integer-primitives-fuzz.test.ts kernel/word-division.test.ts
      - name: Kill the new primitive semantic mutants
        env:
          SUPERCOMPUTER_OUTPUT_DIR: ${{ runner.temp }}/kernel-mutants
        run: |
          mkdir -p "$SUPERCOMPUTER_OUTPUT_DIR"
          bun research/kernel-primitives/mutant-gate.ts
      - name: Compare actual native probe output with imported kernel
        run: bun research/kernel-primitives/probes/run.ts
  generic-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Install the packaged Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.34.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check generic word machine proofs and prior 21 claims
        env:
          SUPERCOMPUTER_OUTPUT_DIR: ${{ runner.temp }}/generic-word-lean
        run: bash research/kernel-primitives/generic-packaged-gate.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-word-lean
          path: ${{ runner.temp }}/generic-word-lean
