# gdp-wired on the supercomputer (github.com/monotykamary/supercomputer): what a job here needs on an instabox box.
# supercomputer/ holds the image's setup script and the job lists (suite.json is also the CI shards' roster).
name = "gdp-wired"

[run]
pre = "export GDP_CYCLIC_LOG=1; "

[instabox]
# (instabox's ci template: Ubuntu 24.04 with GitHub's runner image, as the native CI shards run on; setup.sh adds what
# the boat image had: bun, Lean, Node 24.22.1, clang 19, JDK 21 and Temurin 17, kotlinc, Swift, Rust, solc, anvil)
template = "ci"
setup = "supercomputer/setup.sh"
snapshot = "sc-gdp-wired-46e39e5b8316"
size = "large"
# (the image's toolchains first: pinned Node 24.22.1, Temurin 17 before the system's JDK, solc and anvil, swift)
path = ["/opt/node/bin", "~/.bun/bin", "~/.elan/bin", "/usr/lib/jvm/temurin-17/bin", "/opt/sol", "/opt/foundry", "/opt/swift/usr/bin"]
env = { JAVA_HOME = "/usr/lib/jvm/temurin-17" }
ignore = [".pi/**", "vendor/handwired/lab/recovery-*/**", "**/*.olean", "**/*.ilean", "**/*.c", "**/node_modules/**", "**/runs/**", "runs/**",
          "private/**", "vendor/handwired/lab/ui-exploration/**", "vendor/handwired/lab/knuth-plass/**", "vendor/handwired/assets/**", "vendor/handwired/tests/**",
          "vendor/gdp-ts/examples/**", "**/__pycache__/**"]

# "image": "runner" (GitHub's ubuntu-24.04 runner's toolchains): clang 18 and Temurin 17 first
[instabox.images.runner]
path = ["/usr/lib/llvm-18/bin", "/usr/lib/jvm/temurin-17/bin"]
env = { JAVA_HOME = "/usr/lib/jvm/temurin-17" }

# "image": "chc": the CHC-COMP'26 LIA-Lin benchmarks at /chc and /bench, z3, cvc5, Golem and Eldarica, and the research
# jobs' inputs (`supercomputer image build chc`; the data is the main checkout's runs/, restored from the runs archive)
[instabox.images.chc]
setup = "supercomputer/chc.sh"
snapshot = "sc-gdp-wired-chc-12131a30f8c1"
data = { "/goals" = "runs/modal/dag/goals", "/goals223" = "runs/step/goals223", "/data/spacer-models.jsonl" = "runs/modal/chc2/spacer-models-sat/models.jsonl" }

# "image": "term": TermComp's integer transition systems at /its and /bench, LoAT and KoAT2 (`supercomputer image build term`)
[instabox.images.term]
setup = "supercomputer/term.sh"
snapshot = "sc-gdp-wired-term-5185630355a1"

# The Lean twin's library, compiled once per version of its sources (the key hashes the toolchain and every source)
[[cache]]
name = "olean"
dir = "lean-kernel"
modules = ["Cert", "Kernel", "Cyclic", "Progress", "StepLaw", "Steps", "Sets", "History", "Live", "NonTerm", "Ghost", "Sums", "Refine", "Bridge", "BridgeRules", "Data"]
inputs = "{m}.lean"
outputs = "{m}.olean"
salt = "leanprover/lean4:v4.34.0\n"
